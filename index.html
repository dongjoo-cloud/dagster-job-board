<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dagster Job 현황판 v2</title>
<style>
  :root {
    --bg: #f6f7f9;
    --bg2: #ffffff;
    --bg3: #f0f2f5;
    --border: #e2e6eb;
    --text: #1a1d23;
    --muted: #5c6570;
    --accent: #2563eb;
    --accent-soft: #eff4ff;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --yellow: #b45309;
    --yellow-bg: #fffbeb;
    --gray: #6b7280;
    --gray-bg: #f3f4f6;
    --green: #059669;
    --green-bg: #ecfdf5;
    --chip: #f3f4f6;
    --row-hover: #f8fafc;
    --shadow: 0 1px 3px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.04);
    --radius: 12px;
    --font: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
  body { min-height: 100vh; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 0 16px 48px; }

  header.sticky {
    position: sticky; top: 0; z-index: 50;
    background: rgba(246,247,249,.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 0 12px;
  }
  .hdr-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px; justify-content: space-between; }
  h1 { margin: 0; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; color: var(--text); }
  .gen { color: var(--muted); font-size: .85rem; }

  .kpis { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 12px; font-size: .82rem; color: var(--muted);
    box-shadow: var(--shadow);
  }
  .chip b { color: var(--text); font-weight: 700; margin-left: 4px; }
  .chip.fail b { color: var(--red); }
  .chip.disc b { color: var(--accent); }
  .chip.on b { color: var(--green); }
  .chip.off b { color: var(--gray); }

  .legend {
    display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: .78rem; color: var(--muted);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .dot.fail { background: var(--red); }
  .dot.on { background: var(--green); }
  .dot.off { background: var(--gray); }
  .dot.unk { background: #9ca3af; }

  .controls {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    margin: 16px 0 12px; padding: 12px; background: var(--bg2);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
  .tab {
    background: var(--bg3); border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: .8rem;
  }
  .tab:hover { border-color: var(--accent); color: var(--text); }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .search {
    background: var(--bg2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 8px 12px; min-width: 180px; flex: 1; max-width: 280px;
    font-size: .9rem;
  }
  .search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .toggle {
    display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; color: var(--muted); cursor: pointer;
    user-select: none; white-space: nowrap;
  }
  .toggle input { accent-color: var(--accent); }
  .count { color: var(--muted); font-size: .8rem; margin-left: auto; }

  .table-wrap {
    background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow-x: auto;
  }
  table.board {
    width: 100%; border-collapse: collapse; border-spacing: 0;
    font-size: .84rem;
  }
  thead th {
    text-align: left; padding: 10px 12px; background: var(--bg3);
    color: var(--muted); font-weight: 600; font-size: .72rem;
    border-bottom: 1px solid var(--border); white-space: nowrap;
    position: static;
  }
  tbody tr.job-row { cursor: pointer; }
  tbody tr.job-row:hover { background: var(--row-hover); }
  tbody td {
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    vertical-align: top; max-width: 220px;
  }
  tbody tr:last-child td { border-bottom: none; }
  .name { font-family: var(--mono); font-size: .76rem; color: var(--accent); word-break: break-all; }
  .cat {
    display: inline-block; padding: 2px 8px; border-radius: 6px;
    background: var(--chip); border: 1px solid var(--border); font-size: .7rem; color: var(--muted);
  }
  .sched { color: var(--muted); font-size: .75rem; line-height: 1.35; word-break: break-word; }
  .purpose { color: var(--text); }
  .status-pill, .power-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px; border-radius: 999px; font-size: .75rem; font-weight: 600;
  }
  .status-pill.failing { background: var(--red-bg); color: var(--red); border: 1px solid #fecaca; }
  .status-pill.unknown { background: var(--gray-bg); color: var(--gray); border: 1px solid #e5e7eb; }
  .status-pill.success { background: var(--green-bg); color: var(--green); border: 1px solid #a7f3d0; }
  .status-pill.mixed { background: var(--yellow-bg); color: var(--yellow); border: 1px solid #fde68a; }
  .status-pill.no_recent { background: var(--gray-bg); color: var(--gray); border: 1px solid #e5e7eb; }
  .status-pill.failing { background: var(--red-bg); color: var(--red); border: 1px solid #fecaca; }
  .power-pill.on { background: var(--green-bg); color: var(--green); border: 1px solid #a7f3d0; }
  .power-pill.off { background: var(--gray-bg); color: var(--gray); border: 1px solid #e5e7eb; }
  .power-pill.unknown { background: var(--yellow-bg); color: var(--yellow); border: 1px solid #fde68a; }
  .muted { color: var(--muted); }
  .mono { font-family: var(--mono); font-size: .75rem; }
  a.slack-link {
    color: var(--accent); font-weight: 600; text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  a.slack-link:hover { border-bottom-color: var(--accent); }
  .slack-none { color: var(--muted); }

  tr.detail-row td {
    background: #fafbfc; padding: 0; border-bottom: 1px solid var(--border);
  }
  .detail {
    padding: 14px 16px 18px; display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 20px;
    font-size: .82rem;
  }
  .detail h4 { margin: 0 0 6px; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .detail p { margin: 0; line-height: 1.45; word-break: break-word; }
  .detail ul { margin: 0; padding-left: 18px; color: var(--muted); }
  .fail-list { list-style: none; padding-left: 0; margin: 0; }
  .fail-list li { margin-bottom: 8px; padding: 8px 10px; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; }
  .fail-list a { color: var(--accent); }
  tr.job-row.open { background: var(--row-hover); }
  tr.job-row.open td { border-bottom-color: transparent; }
  .hidden { display: none !important; }

  footer {
    margin-top: 24px; color: var(--muted); font-size: .75rem; line-height: 1.5;
    border-top: 1px solid var(--border); padding-top: 16px;
  }
  @media (max-width: 1000px) {
    .hide-sm { display: none; }
  }
</style>
</head>

<script>
(function () {
  const raw = document.getElementById('board-data').textContent;
  const DATA = JSON.parse(raw);
  const jobs = DATA.jobs || [];
  let cat = 'all';
  let q = '';
  let failOnly = false;
  let onOnly = false;
  let offOnly = false;
  let openName = null;

  document.getElementById('gen-ts').textContent = '생성: ' + (DATA.generated_at_kst || '');
  const k = DATA.kpis || {};
  document.getElementById('kpis').innerHTML = [
    chip('전체', k.total),
    chip('Discovery', k.discovery, 'disc'),
    chip('켜짐', k.on, 'on'),
    chip('꺼짐', k.off, 'off'),
    chip('성공', k.success, 'on'),
    chip('실패중', k.failing, 'fail'),
    chip('혼조', k.mixed),
    chip('최근런없음', k.no_recent),
    chip('슬랙알림있음', k.with_slack_permalink),
  ].join('');

  function chip(label, n, cls) {
    return '<span class="chip ' + (cls || '') + '">' + label + '<b>' + (n == null ? '—' : n) + '</b></span>';
  }

  const caveats = (DATA.caveats || []).map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('');
  document.getElementById('footer').innerHTML =
    '<div><b>데이터 출처</b>: Dagster Cloud Jobs UI + inventory + JOB-INDEX + #dagster-noti · light mode</div>' +
    '<ul>' + caveats + '</ul>' +
    '<div>오프라인: 이 HTML 단독 열기 가능. 갱신은 <code>data.json</code> + REFRESH.md 참고.</div>';

  document.getElementById('tabs').addEventListener('click', function (e) {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    cat = btn.getAttribute('data-cat');
    document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('active', t === btn); });
    render();
  });
  document.getElementById('search').addEventListener('input', function (e) {
    q = (e.target.value || '').trim().toLowerCase();
    render();
  });
  document.getElementById('failOnly').addEventListener('change', function (e) {
    failOnly = !!e.target.checked;
    render();
  });
  document.getElementById('onOnly').addEventListener('change', function (e) {
    onOnly = !!e.target.checked;
    if (onOnly) { offOnly = false; document.getElementById('offOnly').checked = false; }
    render();
  });
  document.getElementById('offOnly').addEventListener('change', function (e) {
    offOnly = !!e.target.checked;
    if (offOnly) { onOnly = false; document.getElementById('onOnly').checked = false; }
    render();
  });

  function filtered() {
    return jobs.filter(function (j) {
      if (cat !== 'all' && j.category !== cat) return false;
      if (failOnly && j.status !== 'failing' && j.status !== 'mixed') return false;
      if (onOnly && j.power !== 'on') return false;
      if (offOnly && j.power !== 'off') return false;
      if (!q) return true;
      const hay = [j.name, j.purpose, j.schedule_text, j.category_label, j.notes, j.directory, j.power_label]
        .join(' ').toLowerCase();
      return hay.indexOf(q) !== -1;
    });
  }

  function statusPill(j) {
    const cls = j.status || 'unknown';
    const label = j.status_label || cls;
    const dot = cls === 'failing' ? 'fail' : cls === 'success' ? 'on' : cls === 'mixed' ? 'off' : 'unk';
    return '<span class="status-pill ' + cls + '"><i class="dot ' + dot +
      '"></i>' + esc(label) + '</span>';
  }

  function powerPill(j) {
    const cls = j.power || 'unknown';
    const label = j.power_label || cls;
    return '<span class="power-pill ' + cls + '"><i class="dot ' +
      (cls === 'on' ? 'on' : cls === 'off' ? 'off' : 'unk') +
      '"></i>' + esc(label) + '</span>';
  }

  function trunc(s, n) {
    if (!s) return '—';
    s = String(s);
    return s.length > n ? s.slice(0, n - 1) + '…' : s;
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function slackCell(j) {
    if (j.latest_fail_permalink) {
      return '<a class="slack-link" href="' + esc(j.latest_fail_permalink) +
        '" target="_blank" rel="noopener" onclick="event.stopPropagation()">메시지</a>';
    }
    return '<span class="slack-none">—</span>';
  }

  function failListHtml(j) {
    const fails = j.failures || [];
    if (!fails.length) return '<p class="muted">없음</p>';
    const items = fails.map(function (f, i) {
      const mark = i === 0 ? ' <b>(최신)</b>' : '';
      return '<li><div class="mono">' + esc(f.ts_kst || '') + mark + '</div>' +
        '<div class="muted">' + esc(f.kind) + ' · ' + esc(f.job_or_sensor || '') + '</div>' +
        '<div class="muted">' + esc(f.snippet || '') + '</div>' +
        (f.permalink
          ? '<div><a href="' + esc(f.permalink) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">Slack 메시지 열기</a></div>'
          : '') +
        '</li>';
    }).join('');
    return '<ul class="fail-list">' + items + '</ul>';
  }

  function detailHtml(j) {
    const sensors = (j.sensors || []).map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') || '<li class="muted">없음</li>';
    const schedules = (j.schedules || []).map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') || '<li class="muted">없음</li>';
    return '<div class="detail">' +
      '<div><h4>경로</h4><p class="mono">' + esc(j.path_prefix || '') + '/' + esc(j.directory || '') + '</p>' +
        '<p class="mono muted">' + esc(j.source_file || '') + '</p>' +
        '<p><span class="cat">' + esc(j.category_label || '') + '</span></p></div>' +
      '<div><h4>용도 상세</h4><p>' + esc(j.purpose) + '</p>' +
        (j.purpose_title ? '<p class="muted">' + esc(j.purpose_title) + '</p>' : '') +
        (j.purpose_blurb ? '<p class="muted">' + esc(j.purpose_blurb) + '</p>' : '') +
        (j.rationale ? '<p class="muted">' + esc(j.rationale) + '</p>' : '') +
      '</div>' +
      '<div><h4>트리거 / 온오프</h4><p class="sched">' + esc(j.schedule_text) + '</p>' +
        '<p class="muted">type: ' + esc(j.trigger_type) + ' · JOB-INDEX: ' + esc(j.dagster_default_status) +
        ' → ' + esc(j.power_label) + '</p></div>' +
      '<div><h4>Sensors</h4><ul>' + sensors + '</ul></div>' +
      '<div><h4>Schedules</h4><ul>' + schedules + '</ul></div>' +
      '<div><h4>실패 통계</h4><p>14일: <b>' + (j.fail_count_14d || 0) + '</b> · 30일: <b>' + (j.fail_count_30d || 0) + '</b></p>' +
        '<p class="muted">시작(추정): ' + esc(j.first_seen_in_window || '—') + '</p>' +
        '<p class="muted">최근: ' + esc(j.last_seen || '—') + '</p>' +
        '<p class="muted">currently_failing(48h): ' + (j.currently_failing ? 'yes' : 'no') + '</p></div>' +
      '<div><h4>Slack 실패 링크 (최대 5)</h4>' + failListHtml(j) + '</div>' +
      '<div><h4>생성일</h4><p>' + esc(j.created_at || 'null') + '</p>' +
        '<p class="muted mono">' + esc(j.created_at_raw || '') + '</p></div>' +
      '<div><h4>비고</h4><p>' + esc(j.notes || '—') + '</p></div>' +
    '</div>';
  }

  function render() {
    const list = filtered();
    document.getElementById('shown').textContent = list.length + ' / ' + jobs.length;
    const tb = document.getElementById('tbody');
    tb.innerHTML = '';
    list.forEach(function (j) {
      const tr = document.createElement('tr');
      tr.className = 'job-row' + (openName === j.name ? ' open' : '');
      tr.dataset.name = j.name;
      tr.innerHTML =
        '<td class="name">' + esc(j.name) + '</td>' +
        '<td>' + powerPill(j) + '</td>' +
        '<td>' + statusPill(j) + '</td>' +
        '<td class="sched">' + esc(trunc(j.schedule_text, 80)) + '</td>' +
        '<td class="purpose">' + esc(j.purpose) + '</td>' +
        '<td class="mono muted">' + esc(j.last_seen || '—') + '</td>' +
        '<td class="mono muted">' + esc(j.first_seen_in_window || '—') + '</td>' +
        '<td>' + slackCell(j) + '</td>' +
        '<td class="mono muted hide-sm">' + esc(j.created_at || '—') + '</td>';
      tb.appendChild(tr);

      const dr = document.createElement('tr');
      dr.className = 'detail-row' + (openName === j.name ? '' : ' hidden');
      dr.dataset.for = j.name;
      const td = document.createElement('td');
      td.colSpan = 9;
      td.innerHTML = detailHtml(j);
      dr.appendChild(td);
      tb.appendChild(dr);
    });
  }

  document.getElementById('tbody').addEventListener('click', function (e) {
    if (e.target.closest('a')) return;
    const tr = e.target.closest('tr.job-row');
    if (!tr) return;
    const name = tr.dataset.name;
    openName = (openName === name) ? null : name;
    render();
  });

  render();
})();
</script>
</body>
</html>
