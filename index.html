<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dagster Job 현황판 v4.1</title>
<style>
  :root {
    --bg: #f6f7f9;
    --bg2: #ffffff;
    --bg3: #f0f2f5;
    --border: #e2e6eb;
    --text: #1a1d23;
    --muted: #5c6570;
    --accent: #2563eb;
    --accent-soft: #eff4ff;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --yellow: #b45309;
    --yellow-bg: #fffbeb;
    --gray: #6b7280;
    --gray-bg: #f3f4f6;
    --green: #059669;
    --green-bg: #ecfdf5;
    --purple: #7c3aed;
    --purple-bg: #f5f3ff;
    --chip: #f3f4f6;
    --row-hover: #f8fafc;
    --shadow: 0 1px 3px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.04);
    --radius: 12px;
    --font: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
  body { min-height: 100vh; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px 48px; }

  header.sticky {
    position: sticky; top: 0; z-index: 50;
    background: rgba(246,247,249,.94);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 0 12px;
  }
  .hdr-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px; justify-content: space-between; }
  h1 { margin: 0; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
  .gen { color: var(--muted); font-size: .85rem; }

  .kpis { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 12px; font-size: .82rem; color: var(--muted);
    box-shadow: var(--shadow);
  }
  .chip b { color: var(--text); font-weight: 700; margin-left: 4px; }
  .chip.ok b { color: var(--green); }
  .chip.warn b { color: var(--yellow); }
  .chip.fail b { color: var(--red); }
  .chip.muted b { color: var(--gray); }
  .chip.disc b { color: var(--accent); }
  .chip.wait b { color: var(--purple); }

  .legend {
    display: flex; flex-wrap: wrap; gap: 12px 16px; margin-top: 10px;
    font-size: .76rem; color: var(--muted);
  }
  .caveat-banner {
    margin-top: 10px; padding: 8px 12px; border-radius: 8px;
    background: var(--yellow-bg); border: 1px solid #fde68a;
    color: var(--yellow); font-size: .78rem;
  }

  .controls {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    margin: 16px 0 12px; padding: 12px; background: var(--bg2);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
  .tab {
    background: var(--bg3); border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: .8rem;
  }
  .tab:hover { border-color: var(--accent); color: var(--text); }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .search {
    background: var(--bg2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 8px 12px; min-width: 160px; flex: 1; max-width: 260px;
    font-size: .9rem;
  }
  .search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .count { color: var(--muted); font-size: .8rem; margin-left: auto; }

  .table-wrap {
    background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: auto;
    max-height: calc(100vh - 210px);
  }
  table.board { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .84rem; }
  thead th {
    position: sticky; top: 0; z-index: 5;
    text-align: left; padding: 10px 12px; background: var(--bg3);
    color: var(--muted); font-weight: 600; font-size: .72rem;
    border-bottom: 1px solid var(--border); white-space: nowrap;
    box-shadow: 0 1px 0 var(--border);
  }
  tbody tr.job-row { cursor: pointer; }
  tbody tr.job-row:hover { background: var(--row-hover); }
  tbody tr.job-row.open { background: var(--row-hover); }
  tbody td {
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  .name { font-family: var(--mono); font-size: .76rem; color: var(--accent); word-break: break-all; }
  .role { color: var(--text); font-size: .8rem; }
  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 9px; border-radius: 999px; font-size: .74rem; font-weight: 600;
    white-space: nowrap;
  }
  .pill.yes { background: var(--green-bg); color: var(--green); border: 1px solid #a7f3d0; }
  .pill.no { background: var(--gray-bg); color: var(--gray); border: 1px solid #e5e7eb; }
  .pill.unk { background: var(--yellow-bg); color: var(--yellow); border: 1px solid #fde68a; }
  .pill.wait { background: var(--purple-bg); color: var(--purple); border: 1px solid #ddd6fe; }
  .pill.obs { background: var(--red-bg); color: var(--red); border: 1px solid #fecaca; }
  .issues { font-size: .78rem; color: var(--muted); line-height: 1.35; max-width: 280px; }
  .issues.has { color: var(--text); }
  .issues .tag {
    display: inline-block; margin: 1px 2px; padding: 1px 6px; border-radius: 4px;
    background: var(--bg3); font-size: .7rem;
  }
  .issues .tag.bad { background: var(--red-bg); color: var(--red); }
  .issues .tag.warn { background: var(--yellow-bg); color: var(--yellow); }
  .issues .tag.wait { background: var(--purple-bg); color: var(--purple); }

  tr.detail-row td { background: #fafbfc; padding: 0; border-bottom: 1px solid var(--border); }
  .detail {
    padding: 14px 16px 18px; display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px 20px;
    font-size: .82rem;
  }
  .detail h4 { margin: 0 0 6px; font-size: .7rem; color: var(--muted); letter-spacing: .04em; }
  .detail p { margin: 0; line-height: 1.45; word-break: break-word; }
  .detail .mono { font-family: var(--mono); font-size: .75rem; }
  a.slack-link { color: var(--accent); font-weight: 600; text-decoration: none; }
  a.slack-link:hover { text-decoration: underline; }
  .fail-list { list-style: none; padding: 0; margin: 0; }
  .fail-list li {
    margin-bottom: 6px; padding: 6px 8px; background: var(--bg2);
    border: 1px solid var(--border); border-radius: 6px; font-size: .75rem;
  }
  .hidden { display: none !important; }
  footer {
    margin-top: 24px; color: var(--muted); font-size: .75rem; line-height: 1.5;
    border-top: 1px solid var(--border); padding-top: 16px;
  }
  .chev { color: var(--muted); font-size: .7rem; margin-right: 4px; }
</style>
</head>

<script>
(function(){
  const data = JSON.parse(document.getElementById('board-data').textContent);
  const jobs = data.jobs || [];
  const kpis = data.kpis || {};
  let tab = 'discovery';
  let q = '';
  let openName = null;

  document.getElementById('gen-ts').textContent = '생성 ' + (data.generated_at_kst || '');

  const kpiDefs = [
    {key:'running', label:'돌고있음', cls:'ok'},
    {key:'pipeline_issue', label:'배관필요·이상', cls:'fail'},
    {key:'obsolete_candidate', label:'obsolete후보', cls:'muted'},
    {key:'cloud_issue', label:'Cloud이슈', cls:'warn'},
    {key:'slack_repeat', label:'Slack반복', cls:'warn'},
    {key:'intentional_wait', label:'의도적대기', cls:'wait'},
    {key:'total', label:'전체', cls:'disc'},
  ];
  const kpiEl = document.getElementById('kpis');
  kpiEl.innerHTML = kpiDefs.map(d => {
    let v = kpis[d.key];
    let extra = '';
    if (d.key==='running' && kpis.toggle_pending) {
      extra = ' <span style="font-weight:400;opacity:.7">(토글미수집 · 48h근사 '+(kpis.running_approx_48h||0)+')</span>';
    }
    return '<span class="chip '+d.cls+'">'+d.label+'<b>'+v+'</b>'+extra+'</span>';
  }).join('');

  if (kpis.toggle_pending) {
    const b = document.getElementById('caveat-banner');
    b.textContent = '⚠ Cloud Automation 토글 미수집 — toggle_on=null. 돌고있음은 엄격 기준 0. 배관이상은 last_run≤48h로 근사.';
    b.classList.remove('hidden');
  }

  const tabsEl = document.getElementById('tabs');
  (data.tabs || []).forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (t.id===tab?' active':'');
    btn.dataset.tab = t.id;
    const n = t.id==='all' ? jobs.length : jobs.filter(j=>j.tab===t.id).length;
    btn.textContent = t.label + ' (' + n + ')';
    btn.onclick = () => { tab = t.id; [...tabsEl.children].forEach(c=>c.classList.toggle('active', c.dataset.tab===tab)); render(); };
    tabsEl.appendChild(btn);
  });

  document.getElementById('search').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); render(); });

  function runningPill(j) {
    if (j.intentional_wait) return '<span class="pill wait">의도적대기</span>';
    if (j.is_running === true) return '<span class="pill yes">예</span>';
    if (j.is_running === false) return '<span class="pill no">아니오</span>';
    // pending
    if (j.within_48h) return '<span class="pill unk" title="토글 미확인 · 48h 내 런 있음">미확인·최근런</span>';
    return '<span class="pill unk" title="토글 미확인">미확인</span>';
  }

  function esc(s) {
    return String(s==null?'':s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function issuesHtml(j) {
    if (!j.issues_summary || j.issues_summary === '—') return '<span class="issues">—</span>';
    const tags = j.issues_summary.split(' · ').map(t => {
      let cls = 'tag';
      if (/배관 잡|Cloud |슬랙 실패/.test(t)) cls += ' bad';
      else if (/폐기 후보|매핑 애매/.test(t)) cls += ' warn';
      else if (/의도적 OFF/.test(t)) cls += ' wait';
      return '<span class="' + cls + '">' + esc(t) + '</span>';
    }).join('');
    return '<span class="issues has">' + tags + '</span>';
  }

  function detailHtml(j) {
    const fails = (j.failures||[]).slice(0,5).map(f =>
      '<li>'+esc(f.ts_kst||'')+' · '+esc(f.kind||'')+
      (f.permalink ? ' · <a class="slack-link" href="'+esc(f.permalink)+'" target="_blank" rel="noopener">슬랙</a>' : '')+
      '</li>'
    ).join('') || '<li class="muted">없음</li>';
    const toggleLabel = j.toggle_on===true?'ON':(j.toggle_on===false?'OFF':'미수집');
    return '<div class="detail">'+
      '<div><h4>Cloud 토글</h4><p>'+toggleLabel+' <span class="muted">('+ esc(j.toggle_source||'') +')</span>'+
      (j.schedule_active_hint!=null?' · hint='+esc(j.schedule_active_hint):'')+'</p></div>'+
      '<div><h4>Cloud 최근 런</h4><p class="mono">'+esc(j.cloud_last_run||'—')+' · '+esc(j.cloud_recent_runs||'—')+'</p></div>'+
      '<div><h4>코드 기본값</h4><p>'+esc(j.dagster_default_status||'—')+' <span class="muted">('+esc(j.power_label||'')+')</span></p></div>'+
      '<div><h4>주기</h4><p>'+esc(j.schedule_text||'—')+'</p></div>'+
      '<div><h4>용도</h4><p>'+esc(j.purpose||'—')+(j.rationale?'<br><span class="muted">'+esc(j.rationale)+'</span>':'')+'</p></div>'+
      '<div><h4>생성일</h4><p>'+esc(j.created_at||'—')+'</p></div>'+
      '<div><h4>Slack 실패(14d)</h4><p>'+ (j.fail_count_14d||0) +
      (j.latest_fail_permalink?' · <a class="slack-link" href="'+esc(j.latest_fail_permalink)+'" target="_blank" rel="noopener">최근 메시지</a>':'')+
      '</p><ul class="fail-list">'+fails+'</ul></div>'+
      '<div><h4>경로</h4><p class="mono">'+esc(j.directory||j.source_file||'—')+'</p></div>'+
      '</div>';
  }

  function filtered() {
    return jobs.filter(j => {
      if (tab !== 'all' && j.tab !== tab) return false;
      if (!q) return true;
      const hay = (j.name+' '+(j.pipeline_role||'')+' '+(j.issues_summary||'')+' '+(j.purpose||'')).toLowerCase();
      return hay.includes(q);
    });
  }

  function render() {
    const list = filtered();
    document.getElementById('count').textContent = list.length + '개';
    const tb = document.getElementById('tbody');
    tb.innerHTML = '';
    list.forEach(j => {
      const tr = document.createElement('tr');
      tr.className = 'job-row' + (openName===j.name?' open':'');
      tr.innerHTML =
        '<td><span class="chev">'+(openName===j.name?'▼':'▶')+'</span><span class="name">'+esc(j.name)+'</span></td>'+
        '<td class="role">'+ esc(j.pipeline_role||'—') +'</td>'+
        '<td>'+ runningPill(j) +'</td>'+
        '<td>'+ issuesHtml(j) +'</td>'+
        '<td>'+ (j.obsolete_candidate
          ? '<span class="pill obs">후보</span>'
          : '<span class="pill no">아니오</span>') +'</td>';
      tr.onclick = () => { openName = openName===j.name ? null : j.name; render(); };
      tb.appendChild(tr);
      if (openName === j.name) {
        const dr = document.createElement('tr');
        dr.className = 'detail-row';
        dr.innerHTML = '<td colspan="5">'+detailHtml(j)+'</td>';
        tb.appendChild(dr);
      }
    });
  }

  document.getElementById('footer').innerHTML =
    'SoT: Claude artifact 배관·재료 · 데이터 스냅샷 Cloud/Slack은 sources 참고 · ' +
    (data.caveats||[]).slice(0,2).join(' · ');

  render();
})();
</script>
</body>
</html>
